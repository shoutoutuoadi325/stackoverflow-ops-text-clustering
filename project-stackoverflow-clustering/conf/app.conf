# Project paths
# Scripts may override PROJECT_HOME/LOCAL_DATA_DIR through environment variables.
# The default LOCAL_DATA_DIR matches the local workspace layout used for this project.
PROJECT_HOME=${PROJECT_HOME:-/opt/bigdata/project-stackoverflow-clustering}
LOCAL_DATA_DIR=${LOCAL_DATA_DIR:-$PROJECT_HOME/../StackOverFlow_Oracle_Database}
RAW_JSON=${RAW_JSON:-oracle_database_questions.json}

# HDFS paths
HDFS_BASE=/user/bigdata/stackoverflow
HDFS_RAW=/user/bigdata/stackoverflow/raw/oracle_database_questions.json
HDFS_JSONL=/user/bigdata/stackoverflow/jsonl/questions.jsonl
HDFS_QUESTIONS=/user/bigdata/stackoverflow/parquet/questions
HDFS_FEATURES=/user/bigdata/stackoverflow/parquet/features
HDFS_EDA=/user/bigdata/stackoverflow/output/eda
HDFS_TOPIC_CLUSTERS=/user/bigdata/stackoverflow/output/topic_clusters
HDFS_SIMILAR_PAIRS=/user/bigdata/stackoverflow/output/similar_pairs
HDFS_CLUSTERS=/user/bigdata/stackoverflow/output/clusters
HDFS_DEMO_INDEX=/user/bigdata/stackoverflow/output/demo_index

# Spark defaults
SPARK_MASTER=${SPARK_MASTER:-yarn}
DEPLOY_MODE=${DEPLOY_MODE:-client}
DRIVER_MEMORY=${DRIVER_MEMORY:-3g}
EXECUTOR_MEMORY=${EXECUTOR_MEMORY:-6g}
EXECUTOR_CORES=${EXECUTOR_CORES:-4}
NUM_EXECUTORS=${NUM_EXECUTORS:-1}
SHUFFLE_PARTITIONS=${SHUFFLE_PARTITIONS:-96}
SPARK_ADAPTIVE_ENABLED=${SPARK_ADAPTIVE_ENABLED:-true}
SPARK_SERIALIZER=${SPARK_SERIALIZER:-org.apache.spark.serializer.KryoSerializer}

# Model parameters
TOP_ANSWERS=${TOP_ANSWERS:-3}
NUM_FEATURES=${NUM_FEATURES:-262144}
MINHASH_TABLES=${MINHASH_TABLES:-4}
LSH_DISTANCE_THRESHOLD=${LSH_DISTANCE_THRESHOLD:-0.25}
SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.75}
LSH_MAX_BUCKET_SIZE=${LSH_MAX_BUCKET_SIZE:-300}
LSH_JOIN_STRATEGY=${LSH_JOIN_STRATEGY:-approx}
LSH_TOP_N_PER_DOC=${LSH_TOP_N_PER_DOC:-10}
CONNECTED_COMPONENT_ITERATIONS=${CONNECTED_COMPONENT_ITERATIONS:-8}
TOPIC_K=${TOPIC_K:-50}

# Innovation knobs
# D3: ORA error-code domain boost. Set ORA_BOOST=0 to disable the boost.
# ORA_RESCUE_FLOOR>0 keeps "rescued" pairs whose raw similarity is below
# SIMILARITY_THRESHOLD but at or above the floor when both sides share an ORA code.
ORA_BOOST=${ORA_BOOST:-0.10}
ORA_RESCUE_FLOOR=${ORA_RESCUE_FLOOR:-0.55}
HDFS_ORA_STATS=${HDFS_ORA_STATS:-/user/bigdata/stackoverflow/output/ora_codes}
HDFS_ORA_SHOWCASE=${HDFS_ORA_SHOWCASE:-/user/bigdata/stackoverflow/output/ora_showcase}

# D2: Tag-partitioned LSH. Tags below MIN_TAG_BUCKET_SIZE are merged into _misc.
PRIMARY_TAG_EXCLUDE=${PRIMARY_TAG_EXCLUDE:-oracle-database}
MIN_TAG_BUCKET_SIZE=${MIN_TAG_BUCKET_SIZE:-50}
HDFS_SIMILAR_PAIRS_PARTITIONED=${HDFS_SIMILAR_PAIRS_PARTITIONED:-/user/bigdata/stackoverflow/output/similar_pairs_partitioned}
